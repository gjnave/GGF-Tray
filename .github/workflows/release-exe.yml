name: Publish Windows downloads

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tray-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/build-exe.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-downloads
          path: downloads
      - name: Verify transferred files and publish release
        working-directory: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check --strict SHA256SUMS.txt
          python3 ../scripts/download_page.py notes "$RUNNER_TEMP/ggf-release.md" --tag "$RELEASE_TAG" --art-ref "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" GGF-Tray-Setup.exe GGF-Tray-Windows-x64.zip GGF-Tray-OneFile.exe SHA256SUMS.txt \
            --verify-tag --title "GGF Tray $RELEASE_TAG for Windows" --notes-file "$RUNNER_TEMP/ggf-release.md"
