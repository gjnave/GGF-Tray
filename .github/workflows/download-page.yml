name: Publish download page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'scripts/download_page.py'
      - 'ggf-menu/artwork/ggf-mark.svg'
      - '.github/workflows/download-page.yml'
  workflow_run:
    workflows: ['Publish Windows downloads']
    types: [completed]
  release:
    types: [published, edited, unpublished, deleted]

permissions:
  contents: read

concurrency:
  group: ggf-download-page
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Build from published GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/download_page.py site "$RUNNER_TEMP/downloads-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/downloads-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
